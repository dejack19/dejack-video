<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- YouTube vuole sapere da quale sito arriva il player (errore 153 se manca): manda sempre l'origine. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Evento video</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  /* Il player è sempre 1920x1080 "interni" e viene scalato allo schermo: YouTube sceglie la
     qualità in base alla dimensione del player, così prende il 1080p anche su schermi piccoli. */
  #stage { position: absolute; inset: 0; background: #000; opacity: 0; }
  #stage.on { opacity: 1; }
  #frame { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #frame iframe, #player { width: 1920px; height: 1080px; border: 0; display: block; }
  /* Strato trasparente sopra tutto: nessun click arriva a YouTube (niente pausa/controlli). */
  #shield { position: absolute; inset: 0; z-index: 5; background: transparent; cursor: none; }

  /* --- Intro --------------------------------------------------------------- */
  #black { position: absolute; inset: 0; z-index: 3; background: #000; display: none; }
  /* Spegnimento TV a tubo catodico: statico bianco con bordi scuri -> si schiaccia in una riga
     luminosa con alone -> la riga si accorcia fino a un punto che si spegne. */
  #tv { position: absolute; inset: 0; z-index: 4; display: none; background: #000; overflow: hidden; }
  #crt { position: absolute; inset: 0; transform-origin: 50% 50%; overflow: hidden; border-radius: 3%; }
  #crt canvas { width: 100%; height: 100%; display: block; image-rendering: auto; }
  #crt .vig { position: absolute; inset: 0;
              background: radial-gradient(ellipse 62% 58% at 50% 50%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 45%, rgba(0,0,0,.55) 75%, rgba(0,0,0,.95) 100%); }
  #crt .white { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #glow { position: absolute; left: 50%; top: 50%; width: 60vmin; height: 60vmin; margin: -30vmin 0 0 -30vmin;
          border-radius: 50%; opacity: 0; pointer-events: none;
          background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(235,240,255,.45) 12%, rgba(200,210,255,.12) 35%, rgba(0,0,0,0) 70%); }
</style>
</head>
<body>
<div id="stage"><div id="frame"><div id="player"></div></div></div>
<div id="black"></div>
<div id="tv"><div id="crt"><canvas id="static" width="192" height="108"></canvas><div class="vig"></div><div class="white"></div></div><div id="glow"></div></div>
<div id="shield"></div>
<script>
// Pagina del player di dejack-video. Pubblicata su https (GitHub Pages): da fw:// YouTube dà "Error 153".
// Parametri nell'hash: #v=<videoId>&s=<inizio video, ms orologio locale>.
// La pagina condivide l'orologio del PC con lo script client, quindi intro e video sono
// sincronizzati da soli; il ponte callEvent/Web.emit (se c'è) serve per durata, fine, ricalibrazioni.
(function () {
  "use strict";
  // Intro, in ms prima dell'inizio del video. I tempi arrivano dal client nell'hash (d, t, b):
  //   d = il gioco "muore" (lo fa lo script client sul gioco; qui la pagina resta trasparente)
  //   t = spegnimento TV a tubo catodico, b = nero, poi il video.
  var DYING = 4500, TV_OFF = 3000, BLACK = 2000;

  var DRIFT_MAX = 0.6;       // secondi di scarto tollerati prima di riallineare
  var SEEK_LEAD = 0.4;       // un seek costa ~0,4-0,5 s di buffering: salta un filo avanti
  var CHECK_EVERY = 60000;   // controllo sync ogni minuto
  var API_TIMEOUT = 15000;
  var QUALITY = "hd1080";

  var player = null, apiReady = false, playerReady = false;
  var videoId = null, startedAtLocal = null;
  var startTimer = null, ended = false, durationSent = false, failed = false, mutedFallbackTried = false;
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), frame = $("frame"), black = $("black"), tv = $("tv");
  var crt = $("crt"), crtWhite = crt.querySelector(".white"), glow = $("glow"), stat = $("static");
  var sctx = stat.getContext("2d"), simg = sctx.createImageData(stat.width, stat.height);

  function send(name, payload) {
    try { if (typeof callEvent === "function") callEvent(name, payload == null ? null : JSON.stringify(payload)); } catch (_) {}
  }
  function fail(reason) {
    if (failed || ended) return;
    failed = true;
    console.warn("[dejack-video] " + reason);
    send("dv:failed", { reason: String(reason) });
  }
  function target() { return (Date.now() - startedAtLocal) / 1000; }
  function duration() { try { return Number(player.getDuration()) || 0; } catch (_) { return 0; } }
  function state() { try { return player.getPlayerState(); } catch (_) { return -1; } }

  // --- Scala 1920x1080 -> schermo (letterbox) -------------------------------------
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    frame.style.transform = "scale(" + s + ") translate(-50%, -50%)";
  }
  addEventListener("resize", fit);
  fit();

  // --- Sottotitoli: spenti sempre (YouTube carica da solo quelli automatici) ------
  function killCaptions() {
    try { player.setOption("captions", "track", {}); } catch (_) {}
    try { player.unloadModule("captions"); } catch (_) {}
    try { player.unloadModule("cc"); } catch (_) {}
  }

  // --- Intro: spegnimento TV come il video di riferimento (youtu.be/jntnUWWkZlA) --------
  // Nessun suono aggiunto dalla pagina.
  var introPhase = "";

  // Statico "neve" chiaro e granuloso del tubo catodico.
  function drawStatic() {
    var d = simg.data;
    for (var i = 0; i < d.length; i += 4) {
      var v = 120 + ((Math.random() * 135) | 0);
      d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 255;
    }
    sctx.putImageData(simg, 0, 0);
  }
  // p = 0..1 dentro lo spegnimento, proporzioni del video di riferimento:
  // ~72% statico, poi in un lampo si schiaccia in una riga, la riga si accorcia, il punto si spegne.
  function drawTv(p) {
    var minSy = Math.max(3 / Math.max(1, innerHeight), 0.002);
    var sx = 1, sy = 1, white = 0, g = 0, gs = 1;
    if (p < 0.72) {                                  // 1) statico bianco con bordi scuri
      drawStatic();
    } else if (p < 0.76) {                           // 2) si schiaccia in verticale e si sbianca
      var k = (p - 0.72) / 0.04; k = k * k;
      drawStatic();
      sy = 1 - (1 - minSy) * k; white = Math.min(1, k * 1.4); g = k * 0.8;
    } else if (p < 0.95) {                           // 3) riga luminosa che si accorcia verso il centro
      var k2 = (p - 0.76) / 0.19;
      sy = minSy; white = 1; sx = Math.max(0.004, 1 - Math.pow(k2, 1.6)); g = 1; gs = 0.6 + 0.4 * (1 - k2);
    } else {                                         // 4) il punto si spegne
      var k3 = (p - 0.95) / 0.05;
      sy = minSy; white = 1; sx = 0.004 * (1 - k3); g = 1 - k3; gs = 0.6 * (1 - k3 * 0.7);
    }
    crt.style.transform = "scale(" + sx + "," + sy + ")";
    crt.style.boxShadow = white >= 1 ? "0 0 12px 4px rgba(255,255,255,.9), 0 0 40px 10px rgba(190,205,255,.45)" : "none";
    crtWhite.style.opacity = String(white);
    glow.style.opacity = String(g);
    glow.style.transform = "scale(" + gs + ")";
    crt.style.opacity = p >= 0.995 ? "0" : "1";
  }

  function setPhase(p) {
    if (p === introPhase) return;
    introPhase = p;
    black.style.display = (p === "tvoff" || p === "black") ? "block" : "none";
    tv.style.display = p === "tvoff" ? "block" : "none";
    if (p === "video") stage.classList.add("on");
  }

  // Un solo ciclo leggero guidato dall'orologio comune: tutti vedono la stessa fase nello stesso istante.
  function tick() {
    if (startedAtLocal == null || ended) return;
    var ms = Date.now() - startedAtLocal;            // < 0 = prima del video
    if (ms >= 0) { setPhase("video"); return; }       // video: niente più da animare
    var intro = ms + DYING + TV_OFF + BLACK;          // 0..totale dentro l'intro
    if (intro < DYING) setPhase("wait");              // pagina trasparente: il gioco "muore" (client)
    else if (intro < DYING + TV_OFF) { setPhase("tvoff"); drawTv((intro - DYING) / TV_OFF); }
    else setPhase("black");
    setTimeout(tick, 50);
  }

  // --- Player ---------------------------------------------------------------------
  function reportDuration() {
    var d = duration();
    if (!durationSent && d > 0) { durationSent = true; send("dv:duration", { seconds: d }); }
  }
  function finish() {
    if (ended) return;
    ended = true;
    try { player.stopVideo(); } catch (_) {}
    send("dv:ended", null);
  }

  // Porta il player alla posizione giusta e lo fa suonare.
  function align() {
    if (!playerReady || ended || startedAtLocal == null) return;
    var t = target();
    if (t < 0) {                                       // prima del via: tieni il video pronto all'inizio
      clearTimeout(startTimer);
      startTimer = setTimeout(align, Math.min(-t * 1000, 60000));
      return;
    }
    var d = duration();
    if (d > 0 && t >= d - 0.5) return finish();       // entrato dopo la fine
    var cur = 0;
    try { cur = Number(player.getCurrentTime()) || 0; } catch (_) {}
    var s = state();
    if (Math.abs(cur - t) > DRIFT_MAX) { try { player.seekTo(t > 1 ? t + SEEK_LEAD : t, true); } catch (_) {} }
    if (s !== YT.PlayerState.PLAYING && s !== YT.PlayerState.BUFFERING) { try { player.playVideo(); } catch (_) {} }
  }

  function onStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) {
      killCaptions();
      try { player.setPlaybackQuality(QUALITY); } catch (_) {}
      if (target() < 0) { try { player.pauseVideo(); player.seekTo(0, true); player.unMute(); } catch (_) {} return; } // pre-caricamento
      if (!durationSent) { setTimeout(align, 4000); setTimeout(align, 12000); } // recupera il ritardo del primo buffering
      reportDuration();
      var cur = 0; try { cur = player.getCurrentTime(); } catch (_) {}
      if (Math.abs(cur - target()) > DRIFT_MAX) { try { player.seekTo(target() + SEEK_LEAD, true); } catch (_) {} }
    } else if (e.data === YT.PlayerState.PAUSED && !ended) {
      setTimeout(align, 250);                          // nessuno può mettere in pausa: riparte subito
    } else if (e.data === YT.PlayerState.ENDED) {
      finish();
    }
  }

  // Se l'autoplay con audio è bloccato, meglio partire muti che non partire.
  function checkAutoplay() {
    if (ended || mutedFallbackTried || !playerReady) return;
    if (target() < 0) { setTimeout(checkAutoplay, -target() * 1000 + 4000); return; }
    var s = state();
    if (s !== YT.PlayerState.PLAYING && s !== YT.PlayerState.BUFFERING) {
      mutedFallbackTried = true;
      console.warn("[dejack-video] autoplay con audio bloccato, riprovo muto");
      try { player.mute(); } catch (_) {}
      align();
    }
  }

  function createPlayer() {
    if (player || !apiReady || !videoId) return;
    var vars = {
      autoplay: 0, controls: 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3,
      modestbranding: 1, playsinline: 1, cc_load_policy: 0, cc_lang_pref: "none", hl: "it", vq: QUALITY
    };
    if (/^https?:$/.test(location.protocol)) vars.origin = location.origin;
    player = new YT.Player("player", {
      width: 1920, height: 1080, videoId: videoId,
      playerVars: vars,
      events: {
        onReady: function () {
          playerReady = true;
          killCaptions();
          try { player.unMute(); player.setVolume(100); } catch (_) {}
          try { player.setPlaybackQuality(QUALITY); } catch (_) {}
          // Prima del via: carica il video in silenzio così parte all'istante.
          if (target() < 0) { try { player.mute(); player.playVideo(); } catch (_) {} }
          align();
          checkAutoplay();
        },
        onApiChange: killCaptions,
        onStateChange: onStateChange,
        onError: function (e) { fail("errore YouTube " + (e && e.data)); }
      }
    });
  }

  function setup(id, start) {
    if (!/^[A-Za-z0-9_-]{11}$/.test(String(id)) || !isFinite(Number(start))) return;
    var first = startedAtLocal == null;
    videoId = String(id);
    startedAtLocal = Number(start);
    createPlayer();
    align();
    if (first) tick();
  }

  window.onYouTubeIframeAPIReady = function () { apiReady = true; createPlayer(); };

  // Ponte opzionale con lo script client.
  window.addEventListener("dv:play", function (e) { var d = e.detail || {}; setup(d.videoId, d.startedAtLocal); });
  window.addEventListener("dv:sync", function (e) {
    var d = e.detail || {};
    if (isFinite(Number(d.startedAtLocal))) { startedAtLocal = Number(d.startedAtLocal); align(); }
  });

  // Avvio dai parametri nell'hash (funziona anche senza ponte).
  var q = {};
  location.hash.replace(/^#/, "").split("&").forEach(function (p) {
    var i = p.indexOf("="); if (i > 0) q[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1));
  });
  function ms(v, def, max) { var n = Math.round(Number(v)); return isFinite(n) && n >= 0 && n <= max ? n : def; }
  DYING = ms(q.d, DYING, 20000); TV_OFF = ms(q.t, TV_OFF, 20000); BLACK = ms(q.b, BLACK, 20000);
  if (q.v && q.s) setup(q.v, q.s);

  setInterval(align, CHECK_EVERY);

  // Diagnostica qualità: per il primo minuto di video manda ogni 5 s cosa sta facendo YouTube
  // (finisce nel log del server, così si capisce perché la qualità scende in gioco).
  var statsSent = 0;
  setInterval(function () {
    if (!playerReady || ended || statsSent >= 12 || startedAtLocal == null || target() < 0) return;
    statsSent++;
    var st = { n: statsSent, t: Math.round(target()), q: "?", levels: [], state: state(),
               w: innerWidth, h: innerHeight, dpr: devicePixelRatio, sw: screen.width, sh: screen.height, loaded: 0, muted: null };
    try { st.q = player.getPlaybackQuality(); } catch (_) {}
    try { st.levels = player.getAvailableQualityLevels(); } catch (_) {}
    try { st.loaded = Math.round(player.getVideoLoadedFraction() * 100); } catch (_) {}
    try { st.muted = player.isMuted(); } catch (_) {}
    try { var f = frame.getBoundingClientRect(); st.box = Math.round(f.width) + "x" + Math.round(f.height); } catch (_) {}
    console.log("[dejack-video] stats " + JSON.stringify(st));
    send("dv:stats", st);
  }, 5000);

  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = function () { fail("iframe_api non caricabile"); };
  document.head.appendChild(s);
  setTimeout(function () { if (!playerReady) fail("timeout player"); }, API_TIMEOUT);

  send("dv:ready", null);
})();
</script>
</body>
</html>
